<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>みんながすわるには？</title>
  <style>
    :root{--ink:#17324d;--green:#0e8f78;--cream:#fffaf0;--orange:#f47a3d;--blue:#3387c9;--red:#e74b4b}
    *{box-sizing:border-box} body{margin:0;background:#eaf4f1;color:var(--ink);font-family:"BIZ UDPGothic","Yu Gothic",sans-serif;overflow:hidden}
    main{height:100vh;min-height:560px;padding:2.2vh 2.6vw 1.5vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.2vh;background:radial-gradient(circle at 90% 8%,#fff 0 8%,transparent 25%),linear-gradient(135deg,#f8fffd,#e9f4ef)}
    header{display:flex;align-items:center;justify-content:space-between;gap:2vw}
    h1{font-size:clamp(26px,3.2vw,58px);margin:0;font-weight:900;letter-spacing:.04em}
    .problem{font-size:clamp(18px,1.7vw,32px);font-weight:700;background:#fff;border:3px solid #9bcfc3;border-radius:18px;padding:.5em .9em;box-shadow:0 5px 0 #c8e2dc}
    .stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,25vw);grid-template-rows:minmax(0,1fr) auto;gap:1vh 2vw;min-height:0}
    .seats{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(90px,1fr));gap:1.2vh 1.1vw;align-content:center;min-height:0}
    .bench{position:relative;min-height:105px;padding:10px 6px 28px;display:flex;justify-content:space-around;align-items:end;opacity:0;transform:translateY(20px);transition:.4s}
    .bench.show{opacity:1;transform:none}.bench:after{content:"";position:absolute;left:2%;right:2%;bottom:10px;height:18px;background:linear-gradient(#d99b42,#b97324);border-radius:6px;box-shadow:0 8px 0 -4px #71491f}
    .person{position:relative;width:clamp(27px,3.1vw,55px);height:clamp(55px,6.3vw,108px);z-index:1;transition:.45s;filter:drop-shadow(0 2px 1px #0002)}
    .person:before{content:"";position:absolute;width:55%;aspect-ratio:1;border-radius:50%;left:22%;top:0;background:var(--skin,#f1bd83);box-shadow:inset 0 7px 0 var(--hair,#493528)}
    .person:after{content:"";position:absolute;width:75%;height:54%;border-radius:45% 45% 14% 14%;left:12%;top:39%;background:var(--shirt,#4ba6c6);border-bottom:9px solid var(--pants,#345b7a)}
    .remainder{grid-column:2;grid-row:1;display:flex;flex-direction:column;justify-content:center;align-items:center;border:5px dashed transparent;border-radius:28px;padding:1vh 1vw;transition:.4s;min-height:0}
    .standing{height:44%;min-height:150px;display:flex;align-items:end;justify-content:center;gap:1vw}
    .rem-label{font-weight:900;font-size:clamp(22px,2.4vw,42px);margin-top:1vh;opacity:0;transform:scale(.8);transition:.35s;color:var(--red)}
    .remainder.focus{border-color:var(--red);background:#fff3f1}.remainder.focus .rem-label{opacity:1;transform:none}
    .message{position:relative;grid-column:1/-1;grid-row:2;background:#fff;border:4px solid var(--green);border-radius:20px;padding:.25em .8em;text-align:center;font-size:clamp(22px,2.45vw,42px);line-height:1.15;font-weight:900;box-shadow:0 6px 0 #acd6cc;opacity:0;transform:translateY(10px);transition:.35s;z-index:8;min-height:0}
    .message.show{opacity:1;transform:none}.equation{color:var(--blue)}
    footer{position:relative;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.2vw}
    .progress{display:flex;gap:8px}.dot{width:14px;height:14px;border-radius:50%;background:#b8ccc7}.dot.on{background:var(--green);transform:scale(1.25)}
    button{position:relative;z-index:40;border:0;border-radius:16px;padding:.55em 1.25em;font-weight:900;font-size:clamp(20px,2vw,36px);font-family:inherit;color:#fff;background:var(--green);box-shadow:0 7px 0 #086555;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}button:active{transform:translateY(5px);box-shadow:0 2px 0 #086555}
    #back{justify-self:end;background:#78909c;box-shadow:0 7px 0 #50636c;font-size:clamp(16px,1.45vw,26px)}
    .extra{position:absolute;right:2%;top:5%;width:24%;height:70%;min-height:120px;z-index:5;display:flex;justify-content:center;align-items:end;opacity:0;transform:translateY(-25px) scale(.8);transition:.6s;background:#fff9d8;border:4px solid #efb83d;border-radius:24px;padding:8px 10px 30px}
    .extra:after{content:"";position:absolute;left:7%;right:7%;bottom:12px;height:18px;background:#c88730;border-radius:6px}.extra.show{opacity:1;transform:none}.extra .person{margin:0 .3vw}
    @media(max-aspect-ratio:4/3){.stage{grid-template-columns:1fr 230px}.bench{min-height:82px}.problem{max-width:47vw}}
    @media(max-height:700px){main{padding-top:1vh;gap:.6vh}.stage{gap:.5vh 1.5vw}.bench{min-height:78px;padding-bottom:24px}.person{height:clamp(48px,5.5vw,82px)}.message{font-size:clamp(19px,2.1vw,34px);padding:.18em .6em}}
  </style>
</head>
<body>
<main>
  <header><h1>みんなが すわるには？</h1><div class="problem">35人が、長いす1きゃくに<br>4人ずつ すわります。</div></header>
  <section class="stage">
    <div class="seats" id="seats"></div>
    <div class="remainder" id="remainder"><div class="standing" id="standing"></div><div class="rem-label">のこりの 3人</div></div>
    <div class="extra" id="extra"></div>
    <div class="message" id="message"></div>
  </section>
  <footer><div class="progress" id="progress"></div><button type="button" id="next" onclick="advance()">すわらせる ▶</button><button type="button" id="back" onclick="resetLesson()">↺ はじめにもどる</button></footer>
</main>
<script>
  var colors=[['#4ba6c6','#345b7a'],['#ef6f61','#5b4a76'],['#79b85a','#356c63'],['#f0a43b','#635040'],['#9b72cf','#3e608c']];
  function makePerson(i){var p=document.createElement('span');var c=colors[i%colors.length];p.className='person';p.style.setProperty('--shirt',c[0]);p.style.setProperty('--pants',c[1]);p.style.setProperty('--hair',['#493528','#754b2f','#2e2926'][i%3]);return p}
  var seats=document.getElementById('seats');
  var standing=document.getElementById('standing');
  var remainder=document.getElementById('remainder');
  var extraBench=document.getElementById('extra');
  var msg=document.getElementById('message');
  var nextButton=document.getElementById('next');
  var progress=document.getElementById('progress');
  var b,j,i,bench,d;
  for(b=0;b<8;b++){bench=document.createElement('div');bench.className='bench';for(j=0;j<4;j++){bench.appendChild(makePerson(b*4+j))}seats.appendChild(bench)}
  for(i=32;i<35;i++){standing.appendChild(makePerson(i))}for(i=32;i<35;i++){extraBench.appendChild(makePerson(i))}
  for(i=0;i<5;i++){d=document.createElement('i');d.className='dot';progress.appendChild(d)}
  var step=0;
  function hasClass(el,name){return (' '+el.className+' ').indexOf(' '+name+' ')>-1}
  function toggleClass(el,name,on){if(on&&!hasClass(el,name)){el.className+=' '+name}if(!on&&hasClass(el,name)){el.className=(' '+el.className+' ').replace(' '+name+' ',' ').replace(/^\s+|\s+$/g,'')}}
  function setStep(n){
    step=n;
    var benches=document.querySelectorAll('.bench');
    var dots=document.querySelectorAll('.dot');
    for(i=0;i<benches.length;i++){toggleClass(benches[i],'show',step>=1)}
    remainder.style.opacity=step>=1?'1':'0';
    toggleClass(remainder,'focus',step>=2&&step<4);
    toggleClass(extraBench,'show',step>=4);
    standing.style.visibility=step>=4?'hidden':'visible';
    toggleClass(msg,'show',step>=2);
    var states=[['','すわらせる ▶'],['','つぎへ ▶'],['<span class="equation">35÷4＝8 あまり3</span><br>「あまり3」は、どの人たち？','考えたら つぎへ ▶'],['8きゃくで、みんな すわれた？<br><span style="color:#e74b4b">この3人が すわるには？</span>','長いすを たす ▶'],['8きゃく ＋ もう1きゃく ＝ <span style="color:#e74b4b;font-size:1.2em">9きゃく</span>','もう一度見る ↺']];
    msg.innerHTML=states[step][0];nextButton.innerHTML=states[step][1];
    for(i=0;i<dots.length;i++){toggleClass(dots[i],'on',i===step)}
  }
  function advance(){setStep(step===4?0:step+1)}
  function resetLesson(){setStep(0)}
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();advance()}if(e.key==='ArrowLeft'){e.preventDefault();resetLesson()}});
  setStep(0);
</script>
</body>
</html>
