<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#112640"><title>暗算チャレンジ｜10問タイムアタック</title>
<style>
:root{--navy:#10263e;--blue:#1766c4;--sky:#eaf4ff;--green:#17865c;--red:#c34b4b;--ink:#17304a;--muted:#65788b;--white:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#dfeef9}button{font:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ffb93b;outline-offset:2px}#app{height:100dvh;min-height:0;padding:max(7px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:7px;max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;min-height:31px;gap:10px}.brand{font-size:clamp(15px,2.2vw,22px);font-weight:900;letter-spacing:.03em}.topright{display:flex;align-items:center;gap:8px}.tiny{font-size:12px;color:var(--muted)}.chip{background:white;border:1px solid #c9dbea;border-radius:30px;padding:5px 12px;font-weight:800;font-size:13px}.mini-btn{border:1px solid #bed1e0;background:white;color:var(--ink);border-radius:12px;padding:6px 11px;font-weight:800;font-size:13px}.screen{flex:1;min-height:0;display:none}.screen.active{display:flex}.home,.result{align-items:center;justify-content:center}.hero{width:min(690px,100%);max-height:100%;overflow:auto;background:white;border-radius:25px;box-shadow:0 12px 30px #163f6120;padding:clamp(14px,3vh,28px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,16px)}.emblem{font-size:clamp(30px,6vh,56px);line-height:1}.hero h1{font-size:clamp(24px,5vh,42px);margin:0;line-height:1.2}.subtitle{font-size:clamp(13px,2.5vh,17px);font-weight:700;color:var(--muted);margin:0}.recordbox{background:#edf5ff;border-radius:17px;padding:9px 22px;min-width:min(320px,90%)}.recordbox small{display:block;color:#546c84;font-size:12px;font-weight:800}.recordbox strong{font-size:clamp(23px,4.4vh,36px);font-variant-numeric:tabular-nums}.primary{background:var(--blue);color:white;border:0;border-radius:16px;padding:clamp(11px,2.4vh,17px) 22px;font-weight:900;font-size:clamp(17px,3vh,23px);box-shadow:0 5px 0 #0c478e;min-width:min(350px,100%)}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #0c478e}.rule{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.play{flex-direction:column;gap:7px}.progressrow{display:flex;align-items:center;gap:12px;min-height:24px}.progresslabel{white-space:nowrap;font-weight:900;font-size:clamp(13px,2.2vh,18px)}.progress{flex:1;display:flex;gap:5px;height:10px}.segment{flex:1;border-radius:20px;background:#c5d9e8}.segment.done{background:#27a779}.gamebody{display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,.83fr);gap:clamp(8px,2vw,20px);flex:1;min-height:0}.questionpanel{background:white;border-radius:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,3vh,24px);padding:12px;min-width:0;position:relative}.question{font-size:clamp(37px,8vw,83px);font-weight:900;white-space:nowrap;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.02em}.answer{width:min(330px,96%);min-height:clamp(54px,12vh,95px);border:3px solid #c5dbea;border-radius:17px;background:#f4faff;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,7vh,60px);font-weight:900;font-variant-numeric:tabular-nums}.answer.empty{color:#a2b5c5}.feedback{height:clamp(22px,4vh,33px);font-size:clamp(16px,3vh,25px);font-weight:900;color:var(--green)}.feedback.bad{color:var(--red)}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(5px,1.2vh,10px);min-height:0}.key{border:2px solid #c4d7e8;border-radius:15px;background:white;color:var(--ink);font-weight:900;font-size:clamp(22px,5vh,38px);min-height:0;box-shadow:0 3px 0 #b4c9dc}.key:active{background:#e4f1ff;transform:translateY(2px);box-shadow:0 1px 0 #b4c9dc}.key.action{font-size:clamp(14px,2.5vh,21px);background:#eaf2f9}.key.submit{background:#1766c4;border-color:#1766c4;color:white;box-shadow:0 3px 0 #0e498c}.key:disabled{opacity:.55;cursor:default}.foot{display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:8px}.footnote{font-size:clamp(10px,1.8vh,13px);color:#64798d;font-weight:700}.exit{border:1px solid #b7cbdc;background:white;color:#536a7e;padding:6px 14px;border-radius:10px;font-weight:800;font-size:13px}.stats{display:flex;gap:9px;width:100%;justify-content:center}.stat{background:#f1f7fc;border-radius:14px;padding:8px 10px;flex:1;max-width:210px}.stat small{display:block;color:#65788b;font-size:12px}.stat strong{font-size:clamp(18px,3.5vh,28px);font-variant-numeric:tabular-nums}.time{font-size:clamp(32px,7vh,58px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}.bestmessage{color:var(--green);font-size:clamp(15px,3vh,24px);font-weight:900;min-height:24px}.actions{display:flex;gap:10px;width:100%;justify-content:center}.actions .primary{min-width:0;flex:1;max-width:340px}.secondary{border:2px solid #c5d7e7;background:white;color:#2c4e6a;border-radius:16px;padding:10px 18px;font-weight:900}.modal{position:fixed;inset:0;background:#10263eb3;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.modal.open{display:flex}.dialog{background:white;border-radius:22px;padding:26px;max-width:390px;width:100%;text-align:center;box-shadow:0 20px 60px #07172b40}.dialog h2{margin:0 0 10px}.dialog p{line-height:1.6}.dialog .actions{margin-top:20px}.dialog .primary{font-size:17px;padding:12px}.confetti{position:fixed;pointer-events:none;inset:0;overflow:hidden;z-index:5}.piece{position:absolute;top:-20px;width:9px;height:16px;animation:fall 1.5s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(680deg);opacity:0}}@media(max-width:600px) and (orientation:portrait){.gamebody{grid-template-columns:1fr;grid-template-rows:minmax(0,.65fr) minmax(0,1.35fr)}.questionpanel{gap:4px;padding:6px}.question{font-size:clamp(28px,7vh,52px)}.answer{min-height:36px;font-size:clamp(22px,5vh,36px)}.feedback{font-size:15px;height:19px}.key{font-size:clamp(20px,4vh,29px)}.footnote{display:none}}@media(max-height:420px){#app{gap:4px}.top{min-height:24px}.hero{gap:6px;padding:9px}.hero h1{font-size:24px}.emblem{font-size:24px}.recordbox{padding:5px 12px}.recordbox strong{font-size:21px}.primary{padding:8px 16px;font-size:16px}.questionpanel{gap:4px}.question{font-size:clamp(33px,7vw,65px)}.answer{min-height:43px;font-size:30px}.feedback{height:20px;font-size:15px}.key{border-radius:10px}.foot{min-height:23px}.exit{padding:3px 9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
 <header class="top"><div class="brand">⚡ 暗算チャレンジ</div><div class="topright"><span class="chip" id="modeChip">10問タイムアタック</span><button id="soundBtn" class="mini-btn" aria-label="音の切り替え">🔊 音あり</button></div></header>
 <main class="screen home active" id="home"><section class="hero"><div class="emblem">🎯</div><h1>暗算チャレンジ</h1><p class="subtitle">10問クリアして、きのうの自分をこえよう！</p><div class="recordbox"><small>🏆 自己ベスト</small><strong id="homeBest">まだ記録がありません</strong></div><button class="primary" id="startBtn">スタート！</button><p class="rule">2けた × 1けた ／ 10問 ／ 時間はゴールまでひみつ！<br>あわてず、正しく暗算しよう。</p></section></main>
 <main class="screen play" id="play"><div class="progressrow"><div class="progresslabel" id="progressLabel">1 / 10 問</div><div class="progress" id="progress" aria-label="進み具合"></div></div><div class="gamebody"><section class="questionpanel"><div class="question" id="question">23 × 4</div><div class="answer empty" id="answer" aria-live="polite">？</div><div class="feedback" id="feedback" aria-live="polite"></div></section><section class="keypad" aria-label="数字を入力"><button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key action" id="deleteBtn">⌫ 消す</button><button class="key" data-digit="0">0</button><button class="key submit" id="submitBtn">決定</button></section></div><footer class="foot"><span class="footnote">ゆっくり考えてOK！ 正解すると次へ進むよ。</span><button class="exit" id="exitBtn">やめる</button></footer></main>
 <main class="screen result" id="result"><section class="hero"><div class="emblem" id="resultIcon">🏆</div><h1>10問クリア！</h1><div class="time" id="resultTime">1分18秒</div><div class="bestmessage" id="bestMessage"></div><div class="stats"><div class="stat"><small>これまでのベスト</small><strong id="oldBest">—</strong></div><div class="stat"><small>まちがい</small><strong id="mistakes">0回</strong></div></div><div class="actions"><button class="primary" id="retryBtn">もう一度！</button><button class="secondary" id="homeBtn">おわる</button></div></section></main>
</div>
<div class="modal" id="exitModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle">ゲームをやめますか？</h2><p>いまの挑戦は記録されません。</p><div class="actions"><button class="secondary" id="cancelExit">つづける</button><button class="primary" id="confirmExit">やめる</button></div></div></div><div class="confetti" id="confetti"></div>
<script>
(()=>{'use strict';
const KEY='anzan-challenge-best-v1', SOUNDKEY='anzan-challenge-sound-v1';
const $=id=>document.getElementById(id);
const pools={easy:[],carry:[]};
for(let a=10;a<=99;a++)for(let b=2;b<=9;b++){
 if(a%10===0||a*b>=100)continue;
 const item={a,b,answer:a*b,id:`${a}x${b}`};
 pools[(a%10)*b>=10?'carry':'easy'].push(item);
}
// 34問＋58問＝92問。10問ごとに繰り上がりなし4問、あり6問。
let best=readBest(),lastIds=[],questions=[],index=0,typed='',mistakeCount=0,elapsed=0,segmentStart=0,locked=false,phase='home',soundOn=readSound(),audioCtx=null,nextTimer=null;
function readBest(){try{const v=Number(localStorage.getItem(KEY));return Number.isFinite(v)&&v>0?v:null}catch{return null}}
function saveBest(v){try{localStorage.setItem(KEY,String(v))}catch{}}
function readSound(){try{return localStorage.getItem(SOUNDKEY)!=='off'}catch{return true}}
function fmt(ms){const seconds=Math.round(ms/1000);return seconds>=60?`${Math.floor(seconds/60)}分${String(seconds%60).padStart(2,'0')}秒`:`${seconds}秒`}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function pick(pool,n){const fresh=shuffle(pool.filter(x=>!lastIds.includes(x.id)));const others=shuffle(pool.filter(x=>lastIds.includes(x.id)));return fresh.concat(others).slice(0,n)}
function show(name){phase=name;document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===name));$('modeChip').textContent=name==='play'?'暗算中':'10問タイムアタック'}
function updateBest(){$('homeBest').textContent=best===null?'まだ記録がありません':fmt(best)}
function updateSound(){$('soundBtn').textContent=soundOn?'🔊 音あり':'🔇 音なし';$('soundBtn').setAttribute('aria-pressed',String(soundOn))}
function tone(ok){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(ok?650:260,t);if(ok)osc.frequency.exponentialRampToValueAtTime(880,t+.1);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.10,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+(ok?.17:.13));osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.19)}catch{}}
function clearTimer(){if(nextTimer!==null){clearTimeout(nextTimer);nextTimer=null}}
function start(){clearTimer();const selected=shuffle([...pick(pools.easy,4),...pick(pools.carry,6)]);questions=selected;lastIds=selected.map(q=>q.id);index=0;typed='';mistakeCount=0;elapsed=0;locked=false;show('play');renderQuestion();segmentStart=performance.now()}
function renderQuestion(){const q=questions[index];$('question').textContent=`${q.a} × ${q.b}`;$('progressLabel').textContent=`${index+1} / 10 問`;$('progress').innerHTML=Array.from({length:10},(_,i)=>`<span class="segment ${i<index?'done':''}"></span>`).join('');$('feedback').textContent='';$('feedback').className='feedback';typed='';renderAnswer();}
function renderAnswer(){$('answer').textContent=typed||'？';$('answer').classList.toggle('empty',!typed)}
function digit(d){if(phase!=='play'||locked||typed.length>=2)return;if(typed===''&&d==='0')return;typed+=d;renderAnswer();$('feedback').textContent=''}
function del(){if(phase!=='play'||locked)return;typed=typed.slice(0,-1);renderAnswer();$('feedback').textContent=''}
function submit(){if(phase!=='play'||locked||typed==='')return;const correct=Number(typed)===questions[index].answer;if(!correct){mistakeCount++;tone(false);$('feedback').textContent='もう一度！';$('feedback').className='feedback bad';typed='';renderAnswer();return}
 locked=true;elapsed+=performance.now()-segmentStart;tone(true);$('feedback').textContent='正解！';$('feedback').className='feedback';if(index===9){finish();return}
 nextTimer=setTimeout(()=>{nextTimer=null;index++;renderQuestion();locked=false;segmentStart=performance.now()},380)}
function finish(){const prior=best;const isNew=prior===null||elapsed<prior;if(isNew){best=elapsed;saveBest(best)}$('resultTime').textContent=fmt(elapsed);$('oldBest').textContent=prior===null?'はじめて！':fmt(prior);$('mistakes').textContent=`${mistakeCount}回`;$('bestMessage').textContent=prior===null?'🎉 はじめての記録！':isNew?`🎉 自己ベスト更新！ ${fmt(prior-elapsed)}はやくなった！`:'10問がんばったね！ また挑戦しよう！';$('resultIcon').textContent=isNew?'🏆':'🌟';updateBest();show('result');if(isNew)celebrate()}
function celebrate(){const root=$('confetti');root.innerHTML='';const colors=['#f2bb3d','#2e9e79','#2c7ed6','#e77d8c'];for(let i=0;i<32;i++){const piece=document.createElement('i');piece.className='piece';piece.style.left=`${Math.random()*100}%`;piece.style.background=colors[i%colors.length];piece.style.animationDelay=`${Math.random()*.45}s`;piece.style.transform=`rotate(${Math.random()*360}deg)`;root.appendChild(piece)}setTimeout(()=>root.innerHTML='',2200)}
function exitRequest(){if(phase==='play')$('exitModal').classList.add('open')}
function exitCancel(){$('exitModal').classList.remove('open')}
function exitConfirm(){clearTimer();exitCancel();locked=true;updateBest();show('home')}
$('startBtn').addEventListener('click',start);$('retryBtn').addEventListener('click',start);$('homeBtn').addEventListener('click',()=>{updateBest();show('home')});$('exitBtn').addEventListener('click',exitRequest);$('cancelExit').addEventListener('click',exitCancel);$('confirmExit').addEventListener('click',exitConfirm);$('submitBtn').addEventListener('click',submit);$('deleteBtn').addEventListener('click',del);document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>digit(b.dataset.digit)));$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem(SOUNDKEY,soundOn?'on':'off')}catch{}updateSound()});document.addEventListener('keydown',e=>{if($('exitModal').classList.contains('open')){if(e.key==='Escape')exitCancel();return}if(phase!=='play')return;if(/^\d$/.test(e.key))digit(e.key);else if(e.key==='Backspace')del();else if(e.key==='Enter')submit();else if(e.key==='Escape')exitRequest()});updateBest();updateSound();
})();
</script></body></html>
