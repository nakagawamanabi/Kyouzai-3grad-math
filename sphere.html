<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>球を切ってみよう｜3年生 算数</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#1b3345;background:#f2f7fb}*{box-sizing:border-box}body{margin:0}.app{height:100dvh;min-height:440px;display:flex;flex-direction:column;padding:10px 15px 9px;gap:8px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{margin:0;font-size:clamp(22px,3.1vw,34px);letter-spacing:.03em}.hint{font-size:clamp(12px,1.6vw,16px);font-weight:700;color:#47677b}.main{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.panel{background:white;border:2px solid #d9e6ef;border-radius:18px;min-height:0;display:flex;flex-direction:column;overflow:hidden}.panelTitle{font-weight:800;font-size:clamp(15px,1.8vw,21px);padding:8px 12px 0}.visual{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.visual svg{width:100%;height:100%;max-height:100%}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.position{flex:1;min-width:0;border:2px solid #b8d0e0;background:#fff;border-radius:13px;padding:11px 4px;font-weight:800;font-size:clamp(13px,1.7vw,18px);color:#1b425b;touch-action:manipulation}.position.active{background:#d8efff;border-color:#1783cb;box-shadow:inset 0 0 0 1px #1783cb}.bottom{display:flex;gap:12px;align-items:center}.primary{background:#ef6944;border:0;border-radius:15px;color:white;font-size:clamp(19px,2.6vw,26px);font-weight:900;padding:12px 28px;min-width:190px;box-shadow:0 3px 0 #b94b2c;touch-action:manipulation}.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #b94b2c}.reset{background:white;border:2px solid #b8cbd8;border-radius:12px;font-size:16px;font-weight:800;padding:10px 17px;touch-action:manipulation}.message{font-weight:800;font-size:clamp(14px,2vw,22px);flex:1;text-align:center}.legend{font-size:clamp(11px,1.3vw,14px);color:#597284;text-align:center;padding:0 8px 7px}.reveal{opacity:0;transition:opacity .35s}.reveal.show{opacity:1}.question{fill:#96aab7;font-size:110px;font-weight:800}.cutCircle{transition:r .35s}.badge{background:#e6f6e9;color:#237a48;border-radius:10px;padding:5px 9px;font-size:13px;font-weight:800}.badge[hidden]{display:none}@media(max-width:650px){.app{padding:7px;gap:6px}.main{gap:6px}.panel{border-radius:12px}.panelTitle{padding:5px 7px 0}.controls{gap:4px}.position{padding:9px 1px;border-radius:9px}.bottom{gap:6px}.primary{min-width:120px;padding:10px 8px}.reset{padding:8px}.hint{display:none}}
</style></head><body><div class="app"><header><h1>🔵 球を切ってみよう</h1><div class="hint">切る場所をえらんで、切り口をたしかめよう！</div></header><div class="controls" role="group" aria-label="切る場所"><button class="position" data-d="-0.75">① 下のほう</button><button class="position" data-d="-0.38">② 少し下</button><button class="position active" data-d="0">③ まん中</button><button class="position" data-d="0.38">④ 少し上</button><button class="position" data-d="0.75">⑤ 上のほう</button></div><div class="main"><section class="panel"><div class="panelTitle">球のどこを切る？</div><div class="visual"><svg viewBox="0 0 420 330" role="img" aria-label="球と、切る高さを示す線"><defs><radialGradient id="sphere" cx="32%" cy="23%" r="80%"><stop offset="0" stop-color="#e2f7ff"/><stop offset=".45" stop-color="#79c7ee"/><stop offset="1" stop-color="#2381bd"/></radialGradient><clipPath id="sphereClip"><circle cx="210" cy="165" r="125"/></clipPath></defs><ellipse cx="210" cy="300" rx="120" ry="12" fill="#e4edf3"/><circle cx="210" cy="165" r="125" fill="url(#sphere)" stroke="#2876a6" stroke-width="2"/><g id="plane" clip-path="url(#sphereClip)"><rect id="planeFill" x="65" y="156" width="290" height="18" fill="#ffdb74" opacity=".8"/><line id="cutLine" x1="65" x2="355" y1="165" y2="165" stroke="#ef6641" stroke-width="5" stroke-dasharray="12 8"/></g><g id="lineEnds"><line id="outerLine" x1="58" x2="362" y1="165" y2="165" stroke="#ed6643" stroke-width="3" stroke-dasharray="10 9"/></g><g id="cutOverlay" class="reveal"><ellipse id="cutEllipse" cx="210" cy="165" rx="125" ry="23" fill="#ffcf64" stroke="#e07721" stroke-width="3"/><path id="frontArc" fill="none" stroke="#d86b23" stroke-width="4"/></g><text x="210" y="22" text-anchor="middle" font-size="16" fill="#607c90" font-weight="700">赤い線のところで切るよ</text></svg></div><div class="legend">切る場所は、赤い線であらわしています。</div></section><section class="panel"><div class="panelTitle">切り口を正面から見ると？ <span id="resultBadge" class="badge" hidden>たしかめた！</span></div><div class="visual"><svg viewBox="0 0 360 330" role="img" aria-label="切り口の形"><circle cx="180" cy="164" r="124" fill="none" stroke="#d9e7ef" stroke-width="3" stroke-dasharray="8 9"/><text id="question" class="question" x="180" y="204" text-anchor="middle">？</text><g id="answer" class="reveal"><circle id="answerCircle" class="cutCircle" cx="180" cy="164" r="124" fill="#ffe29c" stroke="#dd8b22" stroke-width="5"/><circle cx="180" cy="164" r="4" fill="#dd8b22"/><text x="180" y="316" text-anchor="middle" font-size="21" font-weight="800" fill="#2d5d78">切り口は「円」！</text></g></svg></div><div class="legend">点線は、球をまん中で切ったときの円の大きさです。</div></section></div><div class="bottom"><button id="cutBtn" class="primary">✂️ 切ってみる</button><button id="resetBtn" class="reset">もどす</button><div id="message" class="message" aria-live="polite">どんな形になるか、予想してみよう！</div></div></div><script>
(()=>{let d=0,revealed=false;const $=id=>document.getElementById(id);const choices=[...document.querySelectorAll('.position')];function draw(){const y=165-125*d;const radius=125*Math.sqrt(1-d*d);$('cutLine').setAttribute('y1',y);$('cutLine').setAttribute('y2',y);$('outerLine').setAttribute('y1',y);$('outerLine').setAttribute('y2',y);$('planeFill').setAttribute('y',y-9);$('cutEllipse').setAttribute('cy',y);$('cutEllipse').setAttribute('rx',radius);$('cutEllipse').setAttribute('ry',Math.max(5,radius*.19));$('answerCircle').setAttribute('r',radius);$('cutOverlay').classList.toggle('show',revealed);$('answer').classList.toggle('show',revealed);$('question').style.display=revealed?'none':'';$('resultBadge').hidden=!revealed;$('message').textContent=revealed?(Math.abs(d)<.01?'まん中で切ると、いちばん大きな円になるね！':'切る場所がちがうと、円の大きさも変わるね！'):'どんな形になるか、予想してみよう！';$('cutBtn').textContent=revealed?'✂️ もう一度切る':'✂️ 切ってみる';}choices.forEach(b=>b.addEventListener('click',()=>{d=Number(b.dataset.d);revealed=false;choices.forEach(x=>x.classList.toggle('active',x===b));draw()}));$('cutBtn').addEventListener('click',()=>{revealed=true;draw()});$('resetBtn').addEventListener('click',()=>{revealed=false;draw()});draw()})();
</script></body></html>
